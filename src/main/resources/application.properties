spring.application.name=manifesto-service

server.port=${PORT:8081}

# Motoristas Service
motoristas-service.url=${MOTORISTAS_SERVICE_URL:http://localhost:8080}
motoristas-service.timeout.connect-ms=${MOTORISTAS_CONNECT_TIMEOUT_MS:5000}
motoristas-service.timeout.read-ms=${MOTORISTAS_READ_TIMEOUT_MS:30000}

# Upload de manifesto (o padrão do Spring é 1MB)
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# Frontend / CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.br.com.newelog=INFO

# JWT: mesmo segredo do newelog-auth-service (mín. 32 caracteres). Obrigatório.
app.jwt.secret=${JWT_SECRET}
