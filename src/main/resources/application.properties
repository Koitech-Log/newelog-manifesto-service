spring.application.name=manifesto-service

server.port=${PORT:8081}

# Motoristas Service
motoristas-service.url=${MOTORISTAS_SERVICE_URL:http://localhost:8080}
motoristas-service.timeout.connect-ms=${MOTORISTAS_CONNECT_TIMEOUT_MS:5000}
motoristas-service.timeout.read-ms=${MOTORISTAS_READ_TIMEOUT_MS:30000}

# Frontend / CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Upload de arquivos (manifestos e CSV de veículos).
# O limite que o usuário vê (2 MB) é o do VeiculoUploadValidator; este é só a
# trava do servidor, que responde 413 pelo ApiExceptionHandler.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:5MB}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.br.com.newelog=INFO

# JWT: mesmo segredo do newelog-auth-service (mín. 32 caracteres). Obrigatório.
app.jwt.secret=${JWT_SECRET}